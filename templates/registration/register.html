{% extends "base.html" %}
{% load crispy_forms_tags %}
{% load static %}

{% block content %}

    <h2>Register</h2>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <input type="submit" value="Register">
    </form>

    <p>Already signed up? <a href="{% url 'quotes:login' %}">Log in here</a></p>

{% endblock %}
